<style>
  /* ============================================================
     Dala design tokens — verbatim from "Variables CSS Refero
     Styles". Only fix vs. the export: --surface-deep-verdant-tint
     corrected from the truncated #15846 to #15846e.
     ============================================================ */
  :root {
    /* Colors */
    --color-void: #000000;
    --color-bone-white: #ffffff;
    --color-ash-gray: #9a9a9a;
    --color-silver-mist: #bdbdbd;
    --color-electric-iris: #8052ff;
    --color-saffron-spark: #ffb829;
    --color-deep-verdant: #15846e;

    /* Typography — Font Families */
    --font-ppneuemontreal: 'PPNeueMontreal', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

    /* Typography — Scale */
    --text-caption: 12px;      --leading-caption: 1.5;
    --text-nav-label: 14px;    --leading-nav-label: 1.2;   --tracking-nav-label: 0.35px;
    --text-body: 18px;         --leading-body: 1.5;
    --text-heading-2xs: 24px;  --leading-heading-2xs: 1.25; --tracking-heading-2xs: -0.48px;
    --text-heading-xs: 27px;   --leading-heading-xs: 1;
    --text-subheading: 36px;   --leading-subheading: 1.2;
    --text-heading-sm: 42px;   --leading-heading-sm: 1.2;   --tracking-heading-sm: -1.68px;
    --text-heading: 48px;      --leading-heading: 1.1;      --tracking-heading: -1.68px;
    --text-heading-lg: 78px;   --leading-heading-lg: 1.1;   --tracking-heading-lg: -3.12px;
    --text-display: 113px;     --leading-display: 1.1;      --tracking-display: -4.52px;

    /* Typography — Weights */
    --font-weight-extralight: 200;
    --font-weight-regular: 400;
    --font-weight-semibold: 600;
    --font-weight-bold: 700;

    /* Spacing */
    --spacing-unit: 6px;
    --spacing-6: 6px;   --spacing-12: 12px; --spacing-18: 18px;
    --spacing-24: 24px; --spacing-30: 30px; --spacing-36: 36px;
    --spacing-60: 60px; --spacing-96: 96px; --spacing-120: 120px;

    /* Layout — range notes split into usable min/max (the export
       stored these as invalid "60-120px" single values) */
    --page-max-width: 1280px;
    --section-gap-min: 60px;  --section-gap-max: 120px;
    --card-padding-min: 24px; --card-padding-max: 38px;
    --element-gap-min: 6px;   --element-gap-max: 18px;

    /* Border Radius */
    --radius-3xl: 24px;
    --radius-full: 9999px;
    --radius-nav: 24px; --radius-tags: 9999px; --radius-cards: 24px; --radius-buttons: 24px;

    /* Surfaces */
    --surface-void-canvas: #000000;
    --surface-deep-verdant-tint: #15846e; /* export had #15846 (truncated) */
    --surface-electric-iris: #8052ff;

    /* ---- thin aliases so component CSS reads cleanly ---- */
    --void: var(--color-void);
    --bone: var(--color-bone-white);
    --ash: var(--color-ash-gray);
    --silver: var(--color-silver-mist);
    --iris: var(--color-electric-iris);
    --saffron: var(--color-saffron-spark);
    --verdant: var(--color-deep-verdant);
    --sans: var(--font-ppneuemontreal);
    --maxw: var(--page-max-width);
  }

  /* Dala is a committed dark identity — lock it dark in either viewer theme. */
  :root, :root[data-theme="light"], :root[data-theme="dark"] {
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--void);
    color: var(--bone);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }

  #stars {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }
  #fly {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  .shell {
    position: relative;
    z-index: 2;
    max-width: var(--maxw);
    margin: 0 auto;
    padding: 0 clamp(1.25rem, 4vw, 3rem);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Nav ---------- */
  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.6rem 0 0;
    gap: 1rem;
    opacity: 0;
    animation: rise 0.9s ease 0.2s forwards;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-size: 15px;
    letter-spacing: -0.01em;
  }
  .brand svg { display: block; }
  .brand b { font-weight: 400; }
  .links {
    display: flex;
    align-items: center;
    gap: clamp(1rem, 2.4vw, 2rem);
  }
  .links a {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ash);
    text-decoration: none;
    transition: color 0.2s;
  }
  .links a:hover, .links a:focus-visible { color: var(--bone); }
  .pill {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--bone);
    background: var(--iris);
    border: none;
    border-radius: 999px;
    padding: 0.72rem 1.1rem;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
  }
  .pill:hover, .pill:focus-visible {
    transform: translateY(-1px);
    box-shadow: 0 12px 34px rgba(128, 82, 255, 0.4);
    filter: brightness(1.05);
    outline: none;
  }
  .pill:focus-visible { outline: 2px solid var(--saffron); outline-offset: 3px; }

  /* ---------- Hero ---------- */
  .hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: clamp(3rem, 10vh, 7rem) 0;
  }
  .lede { max-width: 34ch; }
  .eyebrow {
    font-size: 13px;
    font-weight: var(--font-weight-semibold);
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--saffron);
    margin: 0 0 1.5rem;
    opacity: 0;
    animation: rise 0.9s ease 0.5s forwards;
  }
  h1 {
    font-weight: 400;
    font-size: clamp(3.4rem, 8.5vw, 6.6rem);
    line-height: 0.94;
    letter-spacing: -0.04em;
    margin: 0;
    text-wrap: balance;
    opacity: 0;
    animation: rise 1s ease 0.65s forwards;
  }
  h1 em {
    font-style: normal;
    display: block;
    color: var(--bone);
  }
  h1 .dim { color: var(--ash); }
  .sub {
    font-weight: var(--font-weight-extralight);
    font-size: clamp(1.05rem, 1.5vw, var(--text-body)); /* signature 18px ultra-light */
    line-height: var(--leading-body);
    color: var(--silver);
    margin: 1.6rem 0 2.2rem;
    opacity: 0;
    animation: rise 1s ease 0.85s forwards;
  }
  .cta-row {
    display: flex;
    align-items: center;
    gap: 1.4rem;
    opacity: 0;
    animation: rise 1s ease 1.05s forwards;
  }
  .ghost {
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.02em;
    color: var(--ash);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: color 0.2s, border-color 0.2s;
  }
  .ghost:hover, .ghost:focus-visible { color: var(--bone); border-color: rgba(255,255,255,0.4); }

  .stage {
    position: relative;
    aspect-ratio: 1 / 1;
    width: 100%;
  }
  .stage-ctrl {
    position: relative;
    margin-top: 2.75rem;
    display: flex;
    gap: 0.4rem;
    padding: 0.3rem;
    border-radius: var(--radius-full);
    background: rgba(0, 0, 0, 0.45);
    border: 1px solid rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(8px);
    opacity: 0;
    animation: rise 1s ease 1.6s forwards;
  }
  .pill.deploy { margin-top: 0.25rem; padding: 0.85rem 1.5rem; font-size: 14px; }
  .stage-ctrl button {
    font-family: var(--sans);
    font-size: 11px;
    font-weight: var(--font-weight-semibold);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ash);
    background: transparent;
    border: none;
    border-radius: var(--radius-full);
    padding: 0.5rem 0.85rem;
    cursor: pointer;
    transition: color 0.2s, background 0.2s;
  }
  .stage-ctrl button:hover { color: var(--bone); }
  .stage-ctrl button.on {
    color: var(--bone);
    background: var(--iris);
  }
  .stage-ctrl button:focus-visible { outline: 2px solid var(--saffron); outline-offset: 2px; }

  /* ---------- Portals ---------- */
  .portals {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: clamp(1.25rem, 3vw, 2.5rem);
    padding: clamp(1.5rem, 4vh, 3rem) 0 1rem;
    border-top: 1px solid rgba(255,255,255,0.06);
    opacity: 0;
    animation: rise 1s ease 1.25s forwards;
  }
  .portal {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    text-decoration: none;
    color: inherit;
  }
  .portal .idx {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--ash);
  }
  .portal .role {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--iris);
  }
  .portal.live .role { color: var(--saffron); }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--iris);
    box-shadow: 0 0 10px rgba(128,82,255,0.8);
  }
  .portal.live .dot { background: var(--saffron); box-shadow: 0 0 10px rgba(255,184,41,0.8); }
  .portal .name {
    font-size: clamp(1.5rem, 2.6vw, 2rem);
    font-weight: 400;
    letter-spacing: -0.03em;
    line-height: 1.05;
    transition: color 0.2s;
  }
  .portal .url {
    font-size: 13px;
    font-weight: 200;
    color: var(--ash);
    transition: color 0.2s;
  }
  .portal:hover .name, .portal:focus-visible .name { color: var(--bone); }
  .portal:hover .url, .portal:focus-visible .url { color: var(--silver); }

  /* ---------- Footer ---------- */
  footer {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 0.75rem;
    padding: 1.5rem 0 1.8rem;
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.08em;
    color: var(--ash);
    opacity: 0;
    animation: rise 1s ease 1.4s forwards;
  }
  footer .quiet { color: rgba(255,255,255,0.28); }

  /* ---------- Floating dragonfly trigger ---------- */
  .df-trigger {
    position: fixed;
    right: clamp(1rem, 3vw, 2rem);
    bottom: clamp(1rem, 3vw, 2rem);
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.5rem 0.95rem 0.5rem 0.55rem;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(128,82,255,0.35);
    border-radius: 999px;
    backdrop-filter: blur(8px);
    cursor: pointer;
    opacity: 0;
    animation: rise 1s ease 1.5s forwards;
    transition: border-color 0.25s, transform 0.25s;
  }
  .df-trigger:hover { border-color: var(--iris); transform: translateY(-2px); }
  .df-trigger svg { display: block; animation: hover 4s ease-in-out infinite; }
  .df-trigger span {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--silver);
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes hover {
    0%,100% { transform: translateY(0) rotate(0); }
    50%     { transform: translateY(-3px) rotate(-4deg); }
  }

  @media (max-width: 860px) {
    .hero { grid-template-columns: 1fr; }
    .stage { order: -1; max-width: 420px; margin: 0 auto; }
    .portals { grid-template-columns: 1fr; gap: 1.75rem; }
    .links a:not(.pill) { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<canvas id="fly"></canvas>

<div class="shell">
  <section class="hero">
    <h1><span class="dim">Something…</span><br>is forming</h1>
    <div class="stage-ctrl" role="group" aria-label="Dragonfly state">
      <button type="button" data-mode="return">Return</button>
      <button type="button" data-mode="fly">Fly</button>
    </div>
  </section>

</div>

    L.pitch = damp(L.pitch, T.pitch, 3, dt); L.flapHz = damp(L.flapHz, T.flapHz, 3, dt);

    /* flap keyframe interpolation */
    var flapI = damp(frame.fi || 0, assembling ? 0 : 1, 3, dt); frame.fi = flapI;
    var beat = tt * L.flapHz; var fpos = (beat - Math.floor(beat)) * K;
    var ka = Math.floor(fpos) % K, kb = (ka + 1) % K, mix = fpos - Math.floor(fpos);
    if (flapI < 0.02) { ka = 0; kb = 0; mix = 0; }

    /* projection + in-plane heading */
    var f = 3.5, cyw = Math.cos(L.yaw), syw = Math.sin(L.yaw), cp = Math.cos(L.pitch), sp2 = Math.sin(L.pitch);
    var cD = -hy, sD = hx;                 // rotate body-up(0,-1) onto heading (hx,hy)
    var k = L.R / 190, Rd = 110;

    for (var j = 0; j < N; j++) {
      var m = meta[j];
      // interpolate keyframe local pos; blend flap toward neutral by flapI
      var lx = fx3(ka, j, 0) * (1 - mix) + fx3(kb, j, 0) * mix;
      var ly = fx3(ka, j, 1) * (1 - mix) + fx3(kb, j, 1) * mix;
      var lz = fx3(ka, j, 2) * (1 - mix) + fx3(kb, j, 2) * mix;
      if (flapI < 0.999) { var n0x = fx3(0, j, 0), n0y = fx3(0, j, 1), n0z = fx3(0, j, 2); lx = n0x + (lx - n0x) * flapI; ly = n0y + (ly - n0y) * flapI; lz = n0z + (lz - n0z) * flapI; }

      var pa = 1;
      if (assembling && !reduce) { pa = Math.min(1, Math.max(0, (local - m.dl) / 1.5)); pa = 1 - Math.pow(1 - pa, 3); }

      // remap horiz=x, vert=body(z), depth=thick(y)
      var wx = lx, wy = lz, wz = ly;
      if (pa < 1) { wx = wx * pa + m.sx * (1 - pa); wy = wy * pa + m.sy * (1 - pa); wz = wz * pa + m.sz * (1 - pa); }
      var x1 = wx * cyw - wz * syw, z1 = wx * syw + wz * cyw;
      var y1 = wy * cp - z1 * sp2, z2 = wy * sp2 + z1 * cp;
      var persp = f / (f - z2);
      var ex = x1 * L.R * persp, ey = -y1 * L.R * persp;
      // in-plane heading rotation (turn to face travel)
      var rx = ex * cD - ey * sD, ry = ex * sD + ey * cD;
      var px = L.cx + rx, py = L.cy + ry;
      // cursor repel
      var dx = px - mX, dy = py - mY, dd = Math.sqrt(dx * dx + dy * dy);
      if (dd < Rd && dd > 0.001) { var force = 1 - dd / Rd; var push = force * force * 48; px += dx / dd * push; py += dy / dd * push; }
      SXA[j] = px; SYA[j] = py;
      SRA[j] = m.base * persp * k * (0.72 + 0.28 * pa);
      var depth = Math.max(0.2, Math.min(1.15, (persp - 0.55) / 1.15));
      SAA[j] = Math.min(0.6, depth * (0.62 + 0.38 * Math.sin(tt * 1.5 + m.ph)) * (0.35 + 0.65 * pa));
    }

    /* draw: constellation edges (one additive stroke) then triangle points */
    fx.clearRect(0, 0, innerWidth, innerHeight);
    fx.globalCompositeOperation = "lighter";
    var edgeAlpha = 0.16 * (assembling ? Math.min(1, local / 2) : 1);
    fx.strokeStyle = "#8052ff"; fx.globalAlpha = edgeAlpha; fx.lineWidth = 0.6; fx.beginPath();
    for (var e = 0; e < ED.length; e += 2) { var A = ED[e], B = ED[e + 1]; fx.moveTo(SXA[A], SYA[A]); fx.lineTo(SXA[B], SYA[B]); }
    fx.stroke();
    for (var j2 = 0; j2 < N; j2++) {
      var r = SRA[j2]; if (r <= 0.05 || SAA[j2] <= 0.01) continue;
      fx.globalAlpha = SAA[j2]; fx.fillStyle = meta[j2].col;
      var xx = SXA[j2], yy = SYA[j2];
      fx.beginPath(); fx.moveTo(xx, yy - r); fx.lineTo(xx + r * 0.87, yy + r * 0.5); fx.lineTo(xx - r * 0.87, yy + r * 0.5); fx.closePath(); fx.fill();
    }
    fx.globalCompositeOperation = "source-over"; fx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  var rt;
  window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(function () { sizeStars(); buildMeta(); }, 150); });
})();
</script>
